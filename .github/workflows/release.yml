name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release LikhoLive
    runs-on: macos-15   # Xcode 16 pre-installed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build Release
        run: |
          xcodebuild \
            -project LikhoLive/LikhoLive.xcodeproj \
            -scheme LikhoLive \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CONFIGURATION_BUILD_DIR=build/Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ENABLE_HARDENED_RUNTIME=YES \
            clean build

      - name: Set version in bundle
        run: |
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.VERSION }}" \
            build/Release/LikhoLive.app/Contents/Info.plist
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion ${{ steps.version.outputs.VERSION }}" \
            build/Release/LikhoLive.app/Contents/Info.plist

      - name: Create ZIP
        run: |
          mkdir -p release
          ditto -c -k --keepParent \
            build/Release/LikhoLive.app \
            release/LikhoLive-${{ steps.version.outputs.VERSION }}.zip

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "LikhoLive ${{ steps.version.outputs.VERSION }}" \
            -srcfolder build/Release/LikhoLive.app \
            -ov \
            -format UDZO \
            release/LikhoLive-${{ steps.version.outputs.VERSION }}.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: LikhoLive v${{ steps.version.outputs.VERSION }}
          body: |
            ## LikhoLive v${{ steps.version.outputs.VERSION }}

            Live transcription for macOS using Sarvam saaras:v3.

            ### Install
            1. Download `LikhoLive-${{ steps.version.outputs.VERSION }}.dmg`
            2. Open the DMG and drag `LikhoLive.app` to your Applications folder
            3. **First launch:** Right-click → Open (required because the app is unsigned)
            4. Grant Microphone and Accessibility permissions when prompted

            ### Requirements
            - macOS 13 Ventura or later
            - A Sarvam API key (enter in the Settings panel)
          files: |
            release/LikhoLive-${{ steps.version.outputs.VERSION }}.dmg
            release/LikhoLive-${{ steps.version.outputs.VERSION }}.zip
          draft: false
          prerelease: false
