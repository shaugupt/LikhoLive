name: LikhoLive
options:
  bundleIdPrefix: com.shaugupt
  deploymentTarget:
    macOS: "13.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    PRODUCT_NAME: LikhoLive
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    OTHER_SWIFT_FLAGS: ""

configs:
  Debug:
    DEBUG_INFORMATION_FORMAT: dwarf
  Release:
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  LikhoLive:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: LikhoLive
        excludes:
          - "Resources/Info.plist"
    resources:
      - path: LikhoLive/Resources
        excludes:
          - "LikhoLive.entitlements"
    info:
      path: LikhoLive/Resources/Info.plist
      properties:
        CFBundleIdentifier: com.shaugupt.LikhoLive
        CFBundleName: LikhoLive
        CFBundleDisplayName: LikhoLive
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: LikhoLive
        LSUIElement: true
        NSMicrophoneUsageDescription: "LikhoLive needs microphone access to transcribe your speech in real time."
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 shaugupt. All rights reserved."
        LSMinimumSystemVersion: "13.0"
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSExceptionDomains:
            api.sarvam.ai:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true
    entitlements:
      path: LikhoLive/Resources/LikhoLive.entitlements
    settings:
      base:
        INFOPLIST_FILE: LikhoLive/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.shaugupt.LikhoLive
        CODE_SIGN_ENTITLEMENTS: LikhoLive/Resources/LikhoLive.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES
    dependencies: []
